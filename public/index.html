<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MasterMind AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b1020;
  color:white;
}

.container{
  max-width:850px;
  margin:auto;
  padding:20px;
}

.header{
  text-align:center;
  padding:25px 10px;
}

.logo{
  font-size:42px;
}

h1{
  margin:8px 0;
  font-size:30px;
}

.subtitle{
  color:#aeb8d0;
}

.card{
  background:#151d36;
  border:1px solid #293556;
  border-radius:22px;
  padding:20px;
  margin-top:20px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  color:#79f2a6;
  margin-bottom:15px;
}

.status-dot{
  width:10px;
  height:10px;
  background:#32e875;
  border-radius:50%;
}

.messages{
  height:430px;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.msg{
  padding:15px 18px;
  border-radius:18px;
  line-height:1.6;
  max-width:88%;
  word-wrap:break-word;
}

.user{
  align-self:flex-end;
  background:#315bd6;
}

.ai{
  align-self:flex-start;
  background:#202b49;
}

.quick{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:15px 0;
}

.quick button{
  background:#202b49;
  color:white;
  border:1px solid #3b4b73;
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
}

.quick button:active{
  transform:scale(.97);
}

.input-area{
  display:flex;
  gap:10px;
}

#command{
  flex:1;
  min-width:0;
  background:#0d1428;
  color:white;
  border:1px solid #3b4b73;
  border-radius:15px;
  padding:15px;
  font-size:16px;
  outline:none;
}

#command:focus{
  border-color:#5276ff;
}

.send{
  background:#4b6fff;
  color:white;
  border:0;
  border-radius:15px;
  padding:0 22px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.send:active{
  transform:scale(.97);
}

.footer{
  text-align:center;
  color:#7783a5;
  font-size:13px;
  margin-top:20px;
}

@media(max-width:600px){

  .container{
    padding:12px;
  }

  .messages{
    height:400px;
  }

  .input-area{
    flex-direction:row;
  }

  .send{
    padding:0 18px;
  }

  .msg{
    max-width:94%;
  }
}
</style>
</head>


<body>

<div class="container">

  <div class="header">

    <div class="logo">🧠</div>

    <h1>MasterMind AI</h1>

    <div class="subtitle">
      आपका Personal AI Agent
    </div>

  </div>


  <div class="card">

    <div class="status">
      <span class="status-dot"></span>
      MasterMind AI Online
    </div>


    <div id="messages" class="messages">

      <div class="msg ai">
        नमस्ते! मैं आपका <b>MasterMind AI</b> हूँ। 🧠
        <br><br>
        आप मुझसे हिंदी, Hinglish या English में बात कर सकते हैं।
        <br><br>
        मैं आपके सवाल को समझकर practical जवाब और अगले steps देने की कोशिश करूँगा।
      </div>

    </div>


    <div class="quick">

      <button onclick="quickCommand('मुझे ऑनलाइन पैसे कमाने का तरीका बताओ')">
        💰 Earning
      </button>

      <button onclick="quickCommand('मेरे लिए YouTube automation project बनाओ')">
        🎬 YouTube
      </button>

      <button onclick="quickCommand('मेरे लिए एक AI agent का plan बनाओ')">
        🤖 AI Agent
      </button>

      <button onclick="quickCommand('आज मेरे लिए क्या काम करना चाहिए?')">
        ⚙️ Tasks
      </button>

      <button onclick="quickCommand('मुझे इस topic पर research करनी है')">
        🔎 Research
      </button>

    </div>


    <div class="input-area">

      <input
        id="command"
        type="text"
        placeholder="अपना आदेश यहाँ लिखें..."
        autocomplete="off"
      >

      <button class="send" onclick="sendCommand()">
        Send
      </button>

    </div>

  </div>


  <div class="footer">
    🛡️ MasterMind AI • Secure AI Backend
  </div>

</div>



<script>

function quickCommand(text){

  const input = document.getElementById("command");

  input.value = text;

  sendCommand();

}



async function sendCommand(){

  const input = document.getElementById("command");

  const text = input.value.trim();

  if(!text){
    return;
  }


  const messages = document.getElementById("messages");


  // User message
  messages.innerHTML +=
    '<div class="msg user">' +
    escapeHtml(text) +
    '</div>';


  input.value = "";


  // Loading
  const loadingId = "loading-" + Date.now();

  messages.innerHTML +=
    '<div class="msg ai" id="' + loadingId + '">' +
    '🧠 MasterMind सोच रहा है...' +
    '</div>';


  messages.scrollTop = messages.scrollHeight;


  try{

    /*
      Real Cloudflare Worker AI backend
    */

    const response = await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message:text
      })

    });


    const data = await response.json();


    // Remove loading message
    const loading = document.getElementById(loadingId);

    if(loading){
      loading.remove();
    }


    let reply = "";


    if(data.ok && data.answer){

      reply = data.answer;

    }

    else if(data.error){

      reply =
        "❌ AI में समस्या आई।<br><br>" +
        escapeHtml(data.error);

    }

    else{

      reply =
        "❌ AI से सही जवाब नहीं मिला।";

    }


    messages.innerHTML +=
      '<div class="msg ai">' +
      formatAnswer(reply) +
      '</div>';


  }

  catch(error){

    const loading = document.getElementById(loadingId);

    if(loading){
      loading.remove();
    }


    messages.innerHTML +=
      '<div class="msg ai">' +
      '❌ AI backend से connection नहीं हो पाया।<br><br>' +
      escapeHtml(error.message) +
      '</div>';

  }


  messages.scrollTop = messages.scrollHeight;

}



function formatAnswer(text){

  /*
    AI के जवाब को सुरक्षित HTML text में बदलना
  */

  return escapeHtml(String(text))
    .replace(/\n/g,"<br>");

}



function escapeHtml(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}



document
  .getElementById("command")
  .addEventListener("keydown",function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      sendCommand();

    }

  });

</script>


</body>
</html>
